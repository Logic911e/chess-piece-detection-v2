# Run `pre-commit install` once to enable. CI runs ruff and pytest separately.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|csv|ipynb)$'
      - id: end-of-file-fixer
        exclude: '\.(csv|ipynb|png)$'
      - id: check-yaml
      - id: check-toml
      # Blocks model weights and datasets from being committed by accident.
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # keep in step with requirements-dev.txt
    hooks:
      # Only the service code is linted; the original course scripts are not.
      - id: ruff-check
        args: [--fix]
        files: ^(src/(predict|app|schemas|position)\.py|tests/(conftest|test_predict|test_api|test_position)\.py|scripts/(log_runs_to_mlflow|eval_position)\.py)$
      - id: ruff-format
        files: ^(src/(predict|app|schemas|position)\.py|tests/(conftest|test_predict|test_api|test_position)\.py|scripts/(log_runs_to_mlflow|eval_position)\.py)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1  # keep in step with requirements-dev.txt
    hooks:
      - id: mypy
        files: ^(src/(predict|app|schemas|position)\.py|tests/(conftest|test_predict|test_api|test_position)\.py|scripts/(log_runs_to_mlflow|eval_position)\.py)$
        additional_dependencies: [fastapi==0.162.0, pillow==13.0.0, pytest==9.2.0, httpx==0.28.1]
