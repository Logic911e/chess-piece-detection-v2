<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess piece detection demo</title>
<style>
  :root {
    --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff; --line: #deded8;
    --accent: #2f5d50; --warn-bg: #fff4d6; --warn-fg: #6b4e00; --err-bg: #fde8e6; --err-fg: #8a1f17;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #ececea; --muted: #a0a09a; --card: #1f1f24; --line: #34343a;
      --accent: #7fc4ae; --warn-bg: #3a3014; --warn-fg: #f0d28a; --err-bg: #3d1f1d; --err-fg: #f4b4ae;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .controls { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: end; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input[type=text], select, input[type=file] {
    width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; }
  input[type=range] { width: 100%; }
  button { padding: 10px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0d1a15; } }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { display: inline-block; font-size: .85rem; padding: 2px 10px; border-radius: 99px;
            border: 1px solid var(--line); color: var(--muted); }
  .status.ok { color: var(--accent); border-color: var(--accent); }
  .notice { margin-top: 14px; padding: 10px 12px; border-radius: 6px; display: none; }
  .notice.warn { background: var(--warn-bg); color: var(--warn-fg); display: block; }
  .notice.err { background: var(--err-bg); color: var(--err-fg); display: block; }
  #results { display: grid; gap: 16px; margin-top: 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .result h2 { font-size: 1.05rem; margin: 0 0 2px; }
  .result .meta { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  canvas { width: 100%; height: auto; border-radius: 6px; background: #000; display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .9rem; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { max-height: 220px; overflow-y: auto; }
  .small { font-size: .8rem; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Chess piece detection</h1>
  <p class="lead">Upload a photo of a chess board. Compare a model trained only on rendered images with the same model fine-tuned on real photographs.</p>

  <div class="panel">
    <div class="controls">
      <div>
        <label for="api">API address <span id="status" class="status">checking</span></label>
        <input id="api" type="text" spellcheck="false">
      </div>
      <div>
        <label for="file">Image (JPEG or PNG)</label>
        <input id="file" type="file" accept="image/jpeg,image/png">
      </div>
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="both" selected>Compare both</option>
          <option value="finetuned">Fine-tuned (real photos)</option>
          <option value="synthetic">Synthetic only</option>
        </select>
      </div>
      <div>
        <label for="conf">Minimum confidence: <span id="confVal">0.25</span></label>
        <input id="conf" type="range" min="0" max="1" step="0.05" value="0.25">
      </div>
      <div><button id="run" disabled>Detect pieces</button></div>
    </div>
    <div id="notice" class="notice" role="status"></div>
  </div>

  <div id="results"></div>

  <p class="small">Non-commercial demo. The models and datasets have their own licences; see the project README.</p>
</main>

<script>
"use strict";

const MAX_UPLOAD_BYTES = 5 * 1024 * 1024; // must match the API limit
const SLOW_AFTER_MS = 4000;               // show the "waking up" message after this
const REQUEST_TIMEOUT_MS = 90000;
const TITLES = { synthetic: "Synthetic model", finetuned: "Fine-tuned model" };

const $ = (id) => document.getElementById(id);
const els = { api: $("api"), file: $("file"), model: $("model"), conf: $("conf"),
              confVal: $("confVal"), run: $("run"), notice: $("notice"),
              results: $("results"), status: $("status") };

// The API address can be given as ?api=https://... so one page works for
// local use and for the deployed service.
els.api.value = new URLSearchParams(location.search).get("api") || "http://localhost:8080";

const apiBase = () => els.api.value.trim().replace(/\/+$/, "");

function notice(kind, text) {
  els.notice.className = "notice" + (kind ? " " + kind : "");
  els.notice.textContent = text || "";
}

function setStatus(text, ok) {
  els.status.textContent = text;
  els.status.className = "status" + (ok ? " ok" : "");
}

// Ping /health on load and when the address changes. On Cloud Run with zero
// minimum instances this also starts the container before the first upload.
async function checkHealth() {
  setStatus("checking", false);
  const slow = setTimeout(() => setStatus("waking up", false), SLOW_AFTER_MS);
  try {
    const r = await fetch(apiBase() + "/health", { signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    setStatus("online", true);
  } catch (e) {
    setStatus("unreachable", false);
  } finally {
    clearTimeout(slow);
  }
}

// The API rejects files over 5 MB. A phone photo can be larger, so shrink it
// in the browser first. Boxes are then drawn on the shrunk image that was sent.
async function prepareImage(file) {
  const bitmap = await createImageBitmap(file);
  if (file.size <= MAX_UPLOAD_BYTES) return { blob: file, bitmap, shrunk: false };
  for (const maxSide of [2048, 1280]) {
    const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bitmap.width * scale);
    c.height = Math.round(bitmap.height * scale);
    c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
    if (blob && blob.size <= MAX_UPLOAD_BYTES) {
      return { blob, bitmap: await createImageBitmap(blob), shrunk: true };
    }
  }
  throw new Error("This image is too large to send, even after shrinking it.");
}

async function predict(blob, model, conf) {
  const form = new FormData();
  form.append("file", blob, "board.jpg");
  const url = `${apiBase()}/predict?model=${model}&conf=${conf}`;
  const r = await fetch(url, { method: "POST", body: form, signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS) });
  if (!r.ok) {
    let detail = "HTTP " + r.status;
    try { const j = await r.json(); if (typeof j.detail === "string") detail = j.detail; } catch (_) {}
    throw new Error(detail);
  }
  return r.json();
}

// White pieces in warm colours, black pieces in cool ones, so colour
// mistakes are easy to see.
function colourFor(name) { return name.startsWith("white") ? "#f0a030" : "#3aa0e0"; }

function draw(canvas, bitmap, detections) {
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(bitmap, 0, 0);
  const line = Math.max(2, bitmap.width / 400);
  const font = Math.max(12, bitmap.width / 55);
  ctx.lineWidth = line;
  ctx.font = `600 ${font}px system-ui, sans-serif`;
  ctx.textBaseline = "top";
  for (const d of detections) {
    const [x1, y1, x2, y2] = d.bbox;
    const colour = colourFor(d.class_name);
    ctx.strokeStyle = colour;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const label = `${d.class_name.replace("-", " ")} ${d.confidence.toFixed(2)}`;
    const w = ctx.measureText(label).width + 8;
    ctx.fillStyle = colour;
    ctx.fillRect(x1, Math.max(0, y1 - font - 6), w, font + 6);
    ctx.fillStyle = "#111";
    ctx.fillText(label, x1 + 4, Math.max(0, y1 - font - 6) + 3);
  }
}

function renderResult(model, data, bitmap) {
  const card = document.createElement("section");
  card.className = "panel result";

  const h = document.createElement("h2");
  h.textContent = TITLES[model] || model;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `${data.detections.length} pieces found, ${data.inference_ms} ms inference`;
  const canvas = document.createElement("canvas");
  card.append(h, meta, canvas);
  draw(canvas, bitmap, data.detections);

  if (data.detections.length) {
    const wrap = document.createElement("div");
    wrap.className = "scroll";
    const table = document.createElement("table");
    const head = table.createTHead().insertRow();
    for (const t of ["Piece", "Confidence"]) head.insertCell().outerHTML = `<th>${t}</th>`;
    const body = table.createTBody();
    [...data.detections].sort((a, b) => b.confidence - a.confidence).forEach((d) => {
      const row = body.insertRow();
      row.insertCell().textContent = d.class_name;
      const c = row.insertCell();
      c.className = "num";
      c.textContent = d.confidence.toFixed(3);
    });
    wrap.append(table);
    card.append(wrap);
  }
  els.results.append(card);
}

async function run() {
  const file = els.file.files[0];
  if (!file) return;
  els.run.disabled = true;
  els.results.replaceChildren();
  notice("", "");

  const slow = setTimeout(() => notice("warn",
    "Waiting for the server. If it has been idle, the first request can take up to a minute while the models load."),
    SLOW_AFTER_MS);

  try {
    const { blob, bitmap, shrunk } = await prepareImage(file);
    const models = els.model.value === "both" ? ["synthetic", "finetuned"] : [els.model.value];
    // Run one after another: the server has one CPU, so parallel calls only queue.
    for (const m of models) {
      renderResult(m, await predict(blob, m, els.conf.value), bitmap);
    }
    setStatus("online", true);
    notice(shrunk ? "warn" : "",
           shrunk ? "The image was over 5 MB, so it was shrunk in your browser before sending." : "");
  } catch (e) {
    const timedOut = e.name === "TimeoutError";
    const network = e instanceof TypeError;
    notice("err", timedOut ? "The server took too long to answer. Try again in a moment."
                  : network ? "Could not reach the API. Check the address above and that the server is running."
                  : e.message);
  } finally {
    clearTimeout(slow);
    els.run.disabled = !els.file.files.length;
  }
}

els.conf.addEventListener("input", () => { els.confVal.textContent = Number(els.conf.value).toFixed(2); });
els.file.addEventListener("change", () => { els.run.disabled = !els.file.files.length; });
els.api.addEventListener("change", checkHealth);
els.run.addEventListener("click", run);
checkHealth();
</script>
</body>
</html>
