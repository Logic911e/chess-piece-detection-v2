[tool.ruff]
line-length = 100
target-version = "py312"
# Only the new service code and its tests are linted. The original
# course-project scripts in src/ are left as they were.
include = [
    "src/predict.py",
    "src/app.py",
    "src/schemas.py",
    "src/position.py",
    "tests/conftest.py",
    "tests/test_predict.py",
    "tests/test_api.py",
    "tests/test_position.py",
    "scripts/log_runs_to_mlflow.py",
    "scripts/eval_position.py",
    "scripts/eval_corner_noise.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["predict", "app", "schemas", "position"]

[tool.pytest.ini_options]
# The original script-style test is run with `python tests/...`, not pytest.
testpaths = ["tests"]
python_files = ["test_predict.py", "test_api.py", "test_position.py"]

[tool.mypy]
python_version = "3.12"
# ultralytics, mlflow and pandas ship little or no type information.
ignore_missing_imports = true
files = [
    "src/predict.py",
    "src/app.py",
    "src/schemas.py",
    "src/position.py",
    "tests/conftest.py",
    "tests/test_predict.py",
    "tests/test_api.py",
    "tests/test_position.py",
    "scripts/log_runs_to_mlflow.py",
    "scripts/eval_position.py",
    "scripts/eval_corner_noise.py",
]
